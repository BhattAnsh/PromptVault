<!DOCTYPE html>
<html>
<head>
  <title>PromptVault - Saved Chats</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    /* Premium Design System */
    :root {
      /* Light theme colors */
      --primary: #667eea;
      --primary-hover: #5a6fd8;
      --primary-light: rgba(102, 126, 234, 0.1);
      --secondary: #764ba2;
      --accent: #f093fb;
      
      --background: #ffffff;
      --surface: #f8fafc;
      --surface-elevated: #ffffff;
      --border: #e2e8f0;
      --border-light: #f1f5f9;
      
      --text-primary: #1e293b;
      --text-secondary: #64748b;
      --text-muted: #94a3b8;
      --text-inverse: #ffffff;
      
      --success: #10b981;
      --success-light: rgba(16, 185, 129, 0.1);
      --warning: #f59e0b;
      --warning-light: rgba(245, 158, 11, 0.1);
      --error: #ef4444;
      --error-light: rgba(239, 68, 68, 0.1);
      
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      
      --radius-sm: 6px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --radius-xl: 16px;
      
      --font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
    }

    /* Dark theme colors */
    [data-theme="dark"] {
      --background: #0f172a;
      --surface: #1e293b;
      --surface-elevated: #334155;
      --border: #475569;
      --border-light: #334155;
      
      --text-primary: #f1f5f9;
      --text-secondary: #cbd5e1;
      --text-muted: #94a3b8;
      
      --primary-light: rgba(102, 126, 234, 0.15);
      --success-light: rgba(16, 185, 129, 0.15);
      --warning-light: rgba(245, 158, 11, 0.15);
      --error-light: rgba(239, 68, 68, 0.15);
    }

    /* Reset and base styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-family);
      background: var(--background);
      color: var(--text-primary);
      line-height: 1.5;
      min-height: 100vh;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }

    .header h1 {
      font-size: 28px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin: 0;
    }

    .theme-toggle {
      position: relative;
    }

    .theme-toggle button {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      background: var(--surface-elevated);
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      font-size: 18px;
    }

    .theme-toggle button:hover {
      background: var(--surface);
      color: var(--text-primary);
      transform: translateY(-1px);
      box-shadow: var(--shadow-md);
    }

    /* Tabs */
    .tabs {
      display: flex;
      background: var(--surface);
      border-radius: var(--radius-lg);
      padding: 4px;
      margin-bottom: 24px;
      border: 1px solid var(--border);
    }

    .tab {
      flex: 1;
      padding: 12px 20px;
      border-radius: var(--radius-md);
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }

    .tab.active {
      background: var(--primary);
      color: var(--text-inverse);
      box-shadow: var(--shadow-sm);
    }

    .tab:not(.active):hover {
      color: var(--text-primary);
      background: var(--border-light);
    }

    /* Session selector */
    .session-selector {
      display: none;
      margin-bottom: 24px;
    }

    .session-selector.active {
      display: block;
    }

    .session-selector h3 {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 16px;
    }

    .session-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    .session-card {
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .session-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .session-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-lg);
      border-color: var(--primary);
    }

    .session-card:hover::before {
      opacity: 1;
    }

    .session-card.selected {
      border-color: var(--primary);
      box-shadow: var(--shadow-md);
      background: var(--primary-light);
    }

    .session-card.selected::before {
      opacity: 1;
    }

    .session-name {
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 8px;
      font-size: 16px;
    }

    .session-info {
      color: var(--text-muted);
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    /* Search bar */
    .search-container {
      position: relative;
      margin-bottom: 24px;
    }

    .search-bar {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .search-input {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--surface-elevated);
      color: var(--text-primary);
      font-size: 14px;
      transition: all 0.2s ease;
    }

    .search-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-light);
    }

    .search-btn {
      padding: 12px 20px;
      background: var(--primary);
      color: var(--text-inverse);
      border: none;
      border-radius: var(--radius-md);
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .search-btn:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
      box-shadow: var(--shadow-md);
    }

    /* Controls */
    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding: 16px 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      gap: 16px;
      flex-wrap: wrap;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .control-btn {
      padding: 8px 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--surface-elevated);
      color: var(--text-secondary);
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .control-btn:hover {
      color: var(--text-primary);
      border-color: var(--primary);
      background: var(--primary-light);
    }

    .dropdown {
      position: relative;
      display: inline-block;
    }

    .dropdown select {
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--surface-elevated);
      color: var(--text-primary);
      font-size: 14px;
      cursor: pointer;
    }

    /* Bulk actions toolbar */
    .bulk-actions {
      display: none;
      padding: 16px 20px;
      background: var(--primary-light);
      border: 1px solid var(--primary);
      border-radius: var(--radius-lg);
      margin-bottom: 24px;
      align-items: center;
      justify-content: space-between;
    }

    .bulk-actions.show {
      display: flex;
    }

    .selected-count {
      color: var(--primary);
      font-weight: 600;
    }

    .action-buttons {
      display: flex;
      gap: 12px;
    }

    .action-btn {
      padding: 8px 16px;
      border-radius: var(--radius-md);
      border: none;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .action-btn.primary {
      background: var(--primary);
      color: var(--text-inverse);
    }

    .action-btn.primary:hover {
      background: var(--primary-hover);
    }

    .action-btn.danger {
      background: var(--error);
      color: var(--text-inverse);
    }

    .action-btn.danger:hover {
      background: #dc2626;
    }

    .action-btn.secondary {
      background: var(--surface);
      color: var(--text-secondary);
      border: 1px solid var(--border);
    }

    .action-btn.secondary:hover {
      color: var(--text-primary);
      border-color: var(--primary);
    }

    /* Chat list */
    .chat-list {
      display: grid;
      gap: 16px;
    }

    .chat-card {
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
      position: relative;
      display: flex;
      align-items: flex-start;
      gap: 16px;
    }

    .chat-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-lg);
      border-color: var(--primary);
    }

    .chat-card.selected {
      border-color: var(--primary);
      background: var(--primary-light);
      box-shadow: var(--shadow-md);
    }

    .chat-checkbox {
      margin-top: 2px;
    }

    .chat-content {
      flex: 1;
    }

    .chat-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
    }

    .chat-title {
      font-weight: 600;
      color: var(--text-primary);
      font-size: 16px;
      line-height: 1.4;
    }

    .chat-platform {
      padding: 4px 10px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 500;
      color: var(--text-inverse);
      background: var(--primary);
    }

    .chat-meta {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 12px;
      color: var(--text-muted);
      font-size: 14px;
    }

    .chat-preview {
      color: var(--text-secondary);
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 12px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .chat-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tag {
      padding: 4px 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      border-radius: var(--radius-sm);
      font-size: 12px;
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 64px 32px;
      color: var(--text-muted);
    }

    .empty-state-icon {
      font-size: 48px;
      margin-bottom: 16px;
      opacity: 0.5;
    }

    .empty-state h3 {
      font-size: 18px;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }

    .empty-state p {
      font-size: 14px;
      line-height: 1.5;
    }

    /* Export dropdown */
    .export-dropdown {
      position: relative;
    }

    .export-menu {
      position: absolute;
      top: 100%;
      right: 0;
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-lg);
      min-width: 200px;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-8px);
      transition: all 0.2s ease;
    }

    .export-dropdown:hover .export-menu {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .export-option {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      color: var(--text-primary);
      text-decoration: none;
      transition: background 0.2s ease;
      font-size: 14px;
    }

    .export-option:hover {
      background: var(--surface);
    }

    .export-option:first-child {
      border-radius: var(--radius-md) var(--radius-md) 0 0;
    }

    .export-option:last-child {
      border-radius: 0 0 var(--radius-md) var(--radius-md);
    }

    /* Responsive design */
    @media (max-width: 768px) {
      .container {
        padding: 16px;
      }

      .header {
        flex-direction: column;
        gap: 16px;
        align-items: flex-start;
      }

      .controls {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
      }

      .bulk-actions {
        flex-direction: column;
        gap: 12px;
        align-items: flex-start;
      }

      .session-grid {
        grid-template-columns: 1fr;
      }

      .chat-card {
        padding: 16px;
      }
    }

    /* Animations */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .chat-card {
      animation: fadeIn 0.3s ease;
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: var(--surface);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <h1>PromptVault - Saved Chats</h1>
      <div class="theme-toggle">
        <button id="theme-toggle-btn" aria-label="Toggle theme"></button>
      </div>
    </header>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab active" data-tab="sessions">Sessions</button>
      <button class="tab" data-tab="random">Random Chats</button>
    </div>

    <!-- Session selector -->
    <div class="session-selector active" id="session-selector">
      <h3>Select a Session</h3>
      <div class="session-grid" id="session-list">
        <!-- Sessions will be populated dynamically -->
      </div>
    </div>

    <!-- Search bar -->
    <div class="search-container">
      <div class="search-bar">
        <input type="text" id="search-input" class="search-input" placeholder="Search in chats...">
        <button id="search-button" class="search-btn">
          <span id="search-icon"></span>
          Search
        </button>
      </div>
    </div>

    <!-- Bulk actions toolbar -->
    <div class="bulk-actions" id="bulk-actions">
      <div class="selected-count">0 chats selected</div>
      <div class="action-buttons">
        <div class="export-dropdown">
          <button class="action-btn primary">
            <span id="export-icon"></span>
            Export ▼
          </button>
          <div class="export-menu" id="export-options">
            <a href="#" id="export-json" class="export-option">
              <span class="export-option-icon" data-format="json"></span>
              JSON Format
            </a>
            <a href="#" id="export-markdown" class="export-option">
              <span class="export-option-icon" data-format="markdown"></span>
              Markdown Format
            </a>
            <a href="#" id="export-text" class="export-option">
              <span class="export-option-icon" data-format="text"></span>
              Plain Text Format
            </a>
            <a href="#" id="export-html" class="export-option">
              <span class="export-option-icon" data-format="html"></span>
              HTML Format
            </a>
          </div>
        </div>
        <button id="delete-selected" class="action-btn danger">
          <span id="delete-icon"></span>
          Delete
        </button>
        <button id="cancel-selection" class="action-btn secondary">Cancel</button>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <div class="control-group">
        <button id="select-all" class="control-btn">Select All</button>
        <button id="select-none" class="control-btn">Deselect All</button>
      </div>
      <div class="control-group">
        <label for="tag-filter">Filter by tag:</label>
        <div class="dropdown">
          <select id="tag-filter">
            <option value="">All tags</option>
            <!-- Tags will be populated dynamically -->
          </select>
        </div>
      </div>
      <div class="control-group">
        <label for="sort-by">Sort by:</label>
        <div class="dropdown">
          <select id="sort-by">
            <option value="date-desc">Date (Newest First)</option>
            <option value="date-asc">Date (Oldest First)</option>
            <option value="title-asc">Title (A-Z)</option>
            <option value="title-desc">Title (Z-A)</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Chat list -->
    <div id="chat-container">
      <div class="empty-state">
        <div class="empty-state-icon">💬</div>
        <h3>No saved chats yet</h3>
        <p>Visit a supported AI platform to start saving chats.</p>
      </div>
    </div>
  </div>

  <script src="../utils/icons.js"></script>
  <script src="chats.js"></script>
</body>
</html>
